name: Android Build

# ---------------------------------------------------------------------------
# CI for FenSu Cloud Album (D version)
# ---------------------------------------------------------------------------
# The repository is Qt 6 / CMake / C++20. This workflow does the two things
# that cannot be done on the development device:
#
#   1. configure + compile the project for Android with the Qt 6 Android SDK
#   2. produce a debug APK as a build artifact
#
# Design notes
# ------------
# Qt is installed with `aqtinstall` instead of a wrapper action. That keeps the
# install path explicit (QT_ROOT_DIR) so CMake always finds it, and it avoids
# depending on which environment variable a third party action happens to
# export this month.
#
# Every step prints what it found. A red build must be diagnosable from the log
# alone, without guessing.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 6.7.2 is the last 6.7 LTS and ships a stable Android toolchain.
  # CMakeLists.txt declares 6.5 as the minimum.
  QT_VERSION: "6.7.2"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  # NDK must be able to target ANDROID_API_LEVEL. NDK 25.2 tops out at API 33
  # and its toolchain refuses android-34 outright:
  #     android-34 is above the maximum supported version 33.
  # NDK 26.1 is the version Qt 6.7 was built and tested against and supports
  # API 34.
  NDK_VERSION: "26.1.10909125"
  # Install Qt outside the checkout so the working tree stays clean and the
  # ~4 GB of Qt does not end up inside the repository directory.
  QT_INSTALL_DIR: "/opt/Qt"

jobs:
  # =========================================================================
  # Job 1: fast repository consistency check (no Qt, no NDK, seconds)
  # =========================================================================
  sanity-check:
    name: Repository sanity check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CMake references resolve
        run: |
          set -euo pipefail
          echo "### Files referenced by CMakeLists.txt"
          missing=0
          while read -r f; do
            if [ -f "$f" ]; then
              echo "  OK   $f"
            else
              echo "::error file=$f::CMakeLists.txt references a missing file"
              missing=1
            fi
          done < <(grep -oE 'src/[A-Za-z0-9_/]+\.(cpp|h|qml)' CMakeLists.txt | sort -u)

          if [ "$missing" -ne 0 ]; then
            echo "::error::Repository is inconsistent."
            exit 1
          fi
          echo "All referenced files are present."

      - name: Verify QML files are well formed
        run: |
          set -euo pipefail
          echo "### QML files"
          find src/ui/qml -name '*.qml' | sort | tee /tmp/qmlfiles.txt
          echo
          echo "### Balanced braces check"
          while read -r f; do
            open=$(tr -cd '{' < "$f" | wc -c)
            close=$(tr -cd '}' < "$f" | wc -c)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::Unbalanced braces: $open open vs $close close"
              exit 1
            fi
          done < /tmp/qmlfiles.txt
          echo "All QML files have balanced braces."

      - name: Verify the Theme singleton registration exists
        run: |
          set -euo pipefail
          # Theme.qml is `pragma Singleton`; without the CMake property the
          # generated qmldir has no singleton entry and every Theme.xxx
          # reference fails at runtime. Catch that here in seconds.
          if ! grep -q 'QT_QML_SINGLETON_TYPE' CMakeLists.txt; then
            echo "::error::CMakeLists.txt is missing QT_QML_SINGLETON_TYPE for Theme.qml"
            exit 1
          fi
          echo "Singleton registration is present."

      - name: Verify QML source paths are consistent
        run: |
          set -euo pipefail

          # Read the qt_add_qml_module call only, so a word in a comment can
          # never be mistaken for a keyword argument. The start line must begin
          # with the command name at column 0, which excludes the explanatory
          # comments that also contain the text "qt_add_qml_module(".
          MODULE_CALL=$(awk '/^qt_add_qml_module\(/{f=1} f{print} f&&/^\)/{exit}' CMakeLists.txt)

          if [ -z "$MODULE_CALL" ]; then
            echo "::error::Could not locate the qt_add_qml_module() call in CMakeLists.txt"
            exit 1
          fi
          echo "### qt_add_qml_module call"
          printf '%s\n' "$MODULE_CALL"

          URI=$(printf '%s\n' "$MODULE_CALL" \
                | grep -oE '^[[:space:]]*URI[[:space:]]+[A-Za-z0-9_]+' \
                | head -1 | awk '{print $2}')
          PREFIX=$(printf '%s\n' "$MODULE_CALL" \
                | grep -oE '^[[:space:]]*RESOURCE_PREFIX[[:space:]]+[^[:space:]]+' \
                | head -1 | awk '{print $2}')
          PREFIX=${PREFIX:-/qt/qml}

          if [ -z "$URI" ]; then
            echo "::error::Could not read the QML module URI from CMakeLists.txt"
            exit 1
          fi
          echo "URI            : $URI"
          echo "RESOURCE_PREFIX: $PREFIX"

          # There is no QT_QML_SOURCE_DIRECTORY argument in qt_add_qml_module().
          # Passing one makes configure fail with "Unknown/unexpected
          # arguments", so guard against it being reintroduced. Only the
          # argument block is inspected: the comments above explain that the
          # argument does not exist and mention it by name.
          if printf '%s\n' "$MODULE_CALL" | grep -q 'QT_QML_SOURCE_DIRECTORY'; then
            echo "::error::QT_QML_SOURCE_DIRECTORY is not a valid argument of qt_add_qml_module()"
            printf '%s\n' "$MODULE_CALL" | grep -n 'QT_QML_SOURCE_DIRECTORY' || true
            exit 1
          fi
          echo "OK: no invalid qt_add_qml_module arguments."

          # Collect the QML_FILES entries.
          QML_FILES=$(printf '%s\n' "$MODULE_CALL" \
                      | sed -n '/QML_FILES/,$p' \
                      | grep -oE '[A-Za-z0-9_/]+\.qml' | sort -u)
          if [ -z "$QML_FILES" ]; then
            echo "::error::No QML_FILES found in qt_add_qml_module()"
            exit 1
          fi

          echo
          echo "### QML_FILES entries and the resource path each one produces"
          EXPECTED_PREFIX="qrc:${PREFIX}/${URI}/"
          fail=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              echo "  OK   ${EXPECTED_PREFIX}${f}   <- ${f}"
            else
              echo "::error file=$f::$f is listed in QML_FILES but does not exist"
              fail=1
            fi
          done <<< "$QML_FILES"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          # The URL main.cpp loads must be one of those exact resource paths.
          LOADED=$(grep -oE 'QUrl\s+url\(QStringLiteral\("(qrc:/qt/qml/[^"]+)"' src/main.cpp \
                   | grep -oE 'qrc:/qt/qml/[^"]+')
          if [ -z "$LOADED" ]; then
            echo "::error::Could not find the QUrl the engine loads in src/main.cpp"
            exit 1
          fi
          echo
          echo "main.cpp loads: $LOADED"

          # Strip the module prefix to get the path as it appears in QML_FILES.
          REL=${LOADED#"qrc:${PREFIX}/${URI}/"}
          if [ "$REL" = "$LOADED" ]; then
            echo "::error::main.cpp loads $LOADED which is outside ${EXPECTED_PREFIX}"
            exit 1
          fi
          if ! printf '%s\n' "$QML_FILES" | grep -qxF "$REL"; then
            echo "::error::main.cpp loads $LOADED but '${REL}' is not in QML_FILES"
            echo "### QML_FILES was:"
            printf '   %s\n' $QML_FILES
            exit 1
          fi
          echo "OK: $REL is listed in QML_FILES and exists."
          echo "OK: expected resource path is ${EXPECTED_PREFIX}${REL}"

      - name: Verify every QML file using Theme imports the module
        run: |
          set -euo pipefail
          fail=0
          for f in $(find src/ui/qml -name '*.qml' | sort); do
            if grep -qE '[^A-Za-z0-9_]Theme\.' "$f"; then
              if ! grep -qE '^import[[:space:]]+FenSuCloudAlbum[[:space:]]*$' "$f"; then
                echo "::error file=$f::uses Theme.* but does not import FenSuCloudAlbum"
                fail=1
              else
                echo "  OK  $f"
              fi
            else
              echo "  --  $f (no Theme usage)"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All QML files using Theme import the module."

  # =========================================================================
  # Job 2: the real Android build
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    needs: sanity-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            ccache \
            p7zip-full \
            python3-pip \
            libgl1-mesa-dev \
            libxkbcommon-dev
          echo "ninja: $(ninja --version)"
          echo "cmake: $(cmake --version | head -1)"

      - name: Prepare Qt install directory
        run: |
          set -euo pipefail
          # /opt is owned by root on the runner and actions/cache needs to be
          # able to write there, so take ownership before the cache step.
          sudo mkdir -p "${QT_INSTALL_DIR}"
          sudo chown -R "$(id -u):$(id -g)" "${QT_INSTALL_DIR}"
          echo "### ${QT_INSTALL_DIR} is writable: $(test -w "${QT_INSTALL_DIR}" && echo yes || echo no)"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_INSTALL_DIR }}
          key: qt-${{ env.QT_VERSION }}-android-arm64-desktop-gcc64-v1

      - name: Install aqtinstall
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "aqtinstall==3.1.18"
          aqt version

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "${QT_INSTALL_DIR}"

          ANDROID_DIR="${QT_INSTALL_DIR}/${{ env.QT_VERSION }}/android_arm64_v8a"
          HOST_DIR="${QT_INSTALL_DIR}/${{ env.QT_VERSION }}/gcc_64"

          # Android target Qt. Installed without an --archives filter so the
          # package is complete: a trimmed install is what makes cmake modules
          # go missing.
          if [ -f "$ANDROID_DIR/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            echo "### Android Qt already present, skipping download"
          else
            echo "### Installing Qt for Android (arm64-v8a)"
            aqt install-qt linux android ${{ env.QT_VERSION }} android_arm64_v8a \
              --outputdir "${QT_INSTALL_DIR}" 2>&1 | tail -15
          fi

          # Host Qt. Cross compiling Qt for Android needs a host build of the
          # same version: qt_add_qml_module runs the host qmlcachegen and
          # qmltyperegistrar. Pointing QT_HOST_PATH at the Android build (as
          # an earlier revision did) fails.
          if [ -f "$HOST_DIR/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            echo "### Host Qt already present, skipping download"
          else
            echo "### Installing Qt for the host (linux gcc_64)"
            aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
              --outputdir "${QT_INSTALL_DIR}" 2>&1 | tail -15
          fi

          echo "### Installed trees:"
          find "${QT_INSTALL_DIR}" -maxdepth 2 -mindepth 2 -type d | sort

      - name: Locate Qt and export its path
        id: qt
        run: |
          set -euo pipefail

          # aqt writes to a fully deterministic location:
          #   <outputdir>/<version>/<archdir>/
          # so build that path first and only fall back to a search if the
          # expected layout is not there. Searching with a fixed maxdepth was
          # the previous bug: Qt6Config.cmake sits seven levels down
          # (Qt/6.7.2/android_arm64_v8a/lib/cmake/Qt6/Qt6Config.cmake) and the
          # search depth was five.
          EXPECTED="${QT_INSTALL_DIR}/${{ env.QT_VERSION }}/android_arm64_v8a"
          echo "### Expected Qt dir: $EXPECTED"

          if [ -d "$EXPECTED" ]; then
            QT_ROOT="$EXPECTED"
          else
            echo "### Expected layout missing, searching instead"
            CONFIG=$(find "${QT_INSTALL_DIR}" -name 'Qt6Config.cmake' -print -quit || true)
            if [ -z "$CONFIG" ]; then
              echo "::error::Could not locate a Qt 6 installation under ${QT_INSTALL_DIR}"
              echo "### Top level of the install dir:"
              ls -la "${QT_INSTALL_DIR}" || true
              echo "### Two levels deep:"
              find "${QT_INSTALL_DIR}" -maxdepth 2 -type d | head -40 || true
              exit 1
            fi
            QT_ROOT=$(dirname "$(dirname "$CONFIG")")
          fi

          echo "### Qt root: $QT_ROOT"
          echo "### Contents:"
          ls "$QT_ROOT" || true

          CONFIG="$QT_ROOT/lib/cmake/Qt6/Qt6Config.cmake"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Qt6Config.cmake not found at $CONFIG"
            echo "### lib/cmake contents:"
            ls "$QT_ROOT/lib/cmake" | head -40 || true
            exit 1
          fi
          echo "### Found: $CONFIG"

          echo "qt_root=$QT_ROOT" >> "$GITHUB_OUTPUT"
          echo "QT_ROOT_DIR=$QT_ROOT" >> "$GITHUB_ENV"

          # Host Qt, needed for the qmlcachegen / qmltyperegistrar tools that
          # run on the build machine.
          HOST_ROOT="${QT_INSTALL_DIR}/${{ env.QT_VERSION }}/gcc_64"
          if [ ! -f "$HOST_ROOT/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            echo "::error::Host Qt not found at $HOST_ROOT"
            find "${QT_INSTALL_DIR}" -maxdepth 2 -mindepth 2 -type d | sort || true
            exit 1
          fi
          echo "### Host Qt: $HOST_ROOT"
          echo "QT_HOST_PATH=$HOST_ROOT" >> "$GITHUB_ENV"

          echo "### Available Qt modules (cmake packages):"
          ls "$QT_ROOT/lib/cmake" | head -40

          for mod in Core Gui Qml Quick QuickControls2 Network Sql Svg; do
            if [ -d "$QT_ROOT/lib/cmake/Qt6${mod}" ]; then
              echo "  OK   Qt6${mod}"
            else
              echo "::error::Qt6${mod} is missing from this Qt installation"
              exit 1
            fi
          done
          echo "### All required Qt modules are present."

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # The ubuntu-22.04 runner image ships a complete Android SDK; there
          # is no need for an extra setup action. The previous revision used
          # android-actions/setup-android@v3, which runs
          #     sdkmanager --install tools
          # as part of its own bootstrap. Newer SDK repositories no longer
          # publish a package called "tools", so sdkmanager exits 1 and the
          # action fails before any of our steps run.
          #
          # Locate the SDK that is already present and, if it is not there,
          # fall back to the standard command line tools location.
          for candidate in \
              "${ANDROID_SDK_ROOT:-}" \
              "${ANDROID_HOME:-}" \
              "/usr/local/lib/android/sdk" \
              "/opt/android-sdk" ; do
            if [ -n "$candidate" ] && [ -d "$candidate/cmdline-tools" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "${SDK:-}" ]; then
            echo "::error::No Android SDK found on this runner."
            echo "### Searching:"
            find / -maxdepth 5 -type d -name 'cmdline-tools' 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "### SDK: $SDK"

          # Put cmdline-tools on PATH so the next step can call sdkmanager directly.
          # Prefer a "latest" directory; otherwise take any version directory.
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            BIN="$SDK/cmdline-tools/latest/bin"
          else
            BIN=""
            for d in "$SDK"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                BIN="$d"
                break
              fi
            done
          fi

          if [ -z "$BIN" ] || [ ! -x "$BIN/sdkmanager" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            ls -la "$SDK/cmdline-tools" || true
            exit 1
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          echo "### sdkmanager: $BIN/sdkmanager"
          # --version is informational; some versions exit non-zero here.
          "$BIN/sdkmanager" --version 2>&1 | tail -3 || true

      - name: Install NDK and platform
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT}"
          echo "### Accepting SDK licences"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          NDK_DIR="${SDK}/ndk/${{ env.NDK_VERSION }}"
          PLATFORM_DIR="${SDK}/platforms/android-${{ env.ANDROID_API_LEVEL }}"
          TOOLS_DIR="${SDK}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"

          # Each component is checked and installed independently. Previously
          # the platform and build-tools were installed inside the same else
          # branch as the NDK, so a cached NDK would have left them missing.
          if [ ! -d "$NDK_DIR" ]; then
            echo "### Installing NDK ${{ env.NDK_VERSION }}"
            sdkmanager --install "ndk;${{ env.NDK_VERSION }}" 2>&1 | tail -5
          else
            echo "### NDK present: $NDK_DIR"
          fi

          if [ ! -d "$PLATFORM_DIR" ]; then
            echo "### Installing platform android-${{ env.ANDROID_API_LEVEL }}"
            sdkmanager --install "platforms;android-${{ env.ANDROID_API_LEVEL }}" 2>&1 | tail -5
          else
            echo "### Platform present: $PLATFORM_DIR"
          fi

          if [ ! -d "$TOOLS_DIR" ]; then
            echo "### Installing build-tools ${{ env.ANDROID_BUILD_TOOLS }}"
            sdkmanager --install "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" 2>&1 | tail -5
          else
            echo "### Build tools present: $TOOLS_DIR"
          fi

          fail=0
          for d in "$NDK_DIR" "$PLATFORM_DIR" "$TOOLS_DIR"; do
            if [ ! -d "$d" ]; then
              echo "::error::Required SDK component missing: $d"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "### Installed NDK:"; ls "${SDK}/ndk" || true
            echo "### Installed platforms:"; ls "${SDK}/platforms" || true
            echo "### Installed build-tools:"; ls "${SDK}/build-tools" || true
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "### NDK: $NDK_DIR"
          echo "### Platform: $PLATFORM_DIR"
          echo "### Build tools: $TOOLS_DIR"

          # NDK 25 refuses API 34; make the pairing explicit so a future bump
          # of one without the other is caught here and not at configure time.
          NDK_SOURCE_PROPS="$NDK_DIR/source.properties"
          if [ -f "$NDK_SOURCE_PROPS" ]; then
            echo "### NDK properties:"
            grep -E 'Pkg.Revision|Pkg.Desc' "$NDK_SOURCE_PROPS" || true
          fi

      - name: Verify Qt is findable before configuring
        run: |
          set -euo pipefail
          echo "### CMAKE_PREFIX_PATH will be: ${QT_ROOT_DIR}"
          echo "### QT_HOST_PATH will be:     ${QT_HOST_PATH}"
          echo

          HOST_CONFIG="${QT_ROOT_DIR}/lib/cmake/Qt6/Qt6Config.cmake"
          echo "### Target Qt6Config:"
          ls -l "$HOST_CONFIG" || { echo "::error::missing $HOST_CONFIG"; exit 1; }
          echo
          echo "### Head of Qt6Config.cmake:"
          head -20 "$HOST_CONFIG"
          echo

          # Qt for Android ships a Qt6 config that knows about cross compiling.
          # If a *_toolchain or Android specific file is missing, find_package
          # will fall back to a host build and the compile will use the wrong
          # architecture.
          echo "### Android specific Qt cmake files:"
          ls "$QT_ROOT_DIR/lib/cmake/Qt6/" | head -40
          echo
          echo "### Qt6Core package dir:"
          ls "$QT_ROOT_DIR/lib/cmake/Qt6Core/" | head -20
          echo

          # Prove the library really is an Android arm64 binary.
          CORE_LIB=$(find "$QT_ROOT_DIR/lib" -maxdepth 1 -name 'libQt6Core*.so*' | head -1)
          echo "### libQt6Core: $CORE_LIB"
          if [ -n "$CORE_LIB" ]; then
            file "$CORE_LIB" || true
          fi
          echo
          echo "### android_arm64_v8a directory listing:"
          ls "$QT_ROOT_DIR" || true

          # Qt resolves the Android SDK itself, from the CMake variable
          # ANDROID_SDK_ROOT, and looks for build-tools underneath it. If that
          # variable is ever empty the error it prints is
          #     Could not locate Android SDK build tools under "/build-tools"
          # which is hard to read. Check the three directories here so the
          # failure names the missing piece.
          echo
          echo "### Android SDK components"
          echo "ANDROID_SDK_ROOT = ${ANDROID_SDK_ROOT}"
          for d in \
              "${ANDROID_SDK_ROOT}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}" \
              "${ANDROID_SDK_ROOT}/platforms/android-${{ env.ANDROID_API_LEVEL }}" \
              "${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" ; do
            if [ -d "$d" ]; then
              echo "  OK   $d"
            else
              echo "::error::Missing SDK component: $d"
              exit 1
            fi
          done
          echo "### build-tools revisions present:"
          ls "${ANDROID_SDK_ROOT}/build-tools" || true
          echo "### platform revisions present:"
          ls "${ANDROID_SDK_ROOT}/platforms" || true

      - name: Configure
        run: |
          set -euo pipefail
          echo "### Environment"
          echo "QT_ROOT_DIR       = ${QT_ROOT_DIR}"
          echo "QT_HOST_PATH      = ${QT_HOST_PATH}"
          echo "ANDROID_NDK_HOME  = ${ANDROID_NDK_HOME}"
          echo "ANDROID_SDK_ROOT  = ${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo

          # The Android toolchain file sets
          #     CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY
          # with CMAKE_FIND_ROOT_PATH pointed at the NDK sysroot. In that mode
          # CMAKE_PREFIX_PATH is ignored for find_package(), which is why the
          # previous revision failed with "Could not find a package
          # configuration file provided by Qt6".
          #
          # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE tells CMake how far up to search:
          #   BOTH      look in the sysroot and the host roots
          #   ONLY      look only in CMAKE_FIND_ROOT_PATH
          #   NEVER     ignore the root path entirely
          # Qt lives outside the sysroot, so BOTH plus an explicit root path is
          # what makes find_package(Qt6) succeed.
          # Qt walks up from ANDROID_SDK_ROOT/build-tools to find an installed
          # build-tools revision. In the previous run the path it reported was
          # literally "/build-tools", which means the CMake variable
          # ANDROID_SDK_ROOT was empty. Exporting ANDROID_SDK_ROOT through
          # $GITHUB_ENV only defines a shell environment variable; CMake does
          # not turn that into a CMake variable, so Qt could not see it. It has
          # to be passed on the command line.
          echo "### Configuring"
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${{ env.ANDROID_API_LEVEL }}" \
            -DANDROID_STL=c++_shared \
            -DANDROID_NDK="${ANDROID_NDK_HOME}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_SDK_BUILD_TOOLS_REVISION="${{ env.ANDROID_BUILD_TOOLS }}" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_FIND_ROOT_PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot;${QT_ROOT_DIR}" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DQT_HOST_PATH="${QT_HOST_PATH}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_ANDROID_ABIS=arm64-v8a

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build-android --parallel "$(nproc)" 2>&1 | tail -150

      - name: Verify the QML resource paths the build actually produced
        run: |
          set -euo pipefail

          # The generated .qrc files are the ground truth for where the QML
          # files ended up. Read them instead of guessing at the mapping.
          echo "### Generated .qrc files"
          find build-android -name '*.qrc' -print || true
          echo

          QRC=$(find build-android -name '*.qrc' -print -quit || true)
          if [ -z "$QRC" ]; then
            echo "::error::No .qrc file was generated."
            echo "### build tree (2 levels):"
            find build-android -maxdepth 2 -type d | head -40 || true
            exit 1
          fi

          echo "### QML entries inside $QRC"
          # qrc entries look like  <file alias="qt/qml/...">path</file>
          grep -oE '<file[^>]*>[^<]*</file>' "$QRC" | sed 's|<file |  |; s|</file>||' || true
          echo

          echo "### Resource paths (alias attribute)"
          ALIASES=$(grep -oE 'alias="[^"]*\.qml"' "$QRC" | sed 's/alias="//; s/"$//' | sort -u)
          if [ -n "$ALIASES" ]; then
            printf '  :/%s\n' $ALIASES
          else
            echo "  (no alias attributes, the file paths are the resource paths)"
          fi
          echo

          # main.cpp asks for a specific URL. It must exist in the resource
          # tree, otherwise the engine creates no root object at runtime.
          LOADED=$(grep -oE 'QUrl\s+url\(QStringLiteral\("(qrc:/[^"]+)"' src/main.cpp \
                   | grep -oE 'qrc:/[^"]+')
          echo "### main.cpp loads: $LOADED"

          RES=`printf '%s' "$LOADED" | sed 's|^qrc:/|:/|'`
          echo "### Resource name expected: $RES"

          if grep -qE "alias=\"${RES#:/}\"|>${RES}</file>|alias=\"[^\"]*${RES##*/}\"" "$QRC"; then
            echo "OK: the loaded resource is present in the generated .qrc"
          else
            echo "::warning::The loaded resource was not matched in the .qrc by a simple pattern."
            echo "::warning::Compare the lists above with $LOADED."
            echo "### Full qrc contents:"
            head -60 "$QRC"
          fi

          # Independently confirm every QML file from the source tree shows up.
          echo
          echo "### Cross check: source QML files vs qrc entries"
          fail=0
          for f in $(find src/ui/qml -name '*.qml' | sort); do
            base=$(basename "$f")
            if grep -qF "$base" "$QRC"; then
              echo "  present  $f"
            else
              echo "::error file=$f::$base is not present in the generated .qrc"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All QML sources are embedded in the resource system."

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          echo "### Searching for APKs"
          find build-android -name '*.apk' -type f -print || true
          APK=$(find build-android -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::The build succeeded but produced no APK."
            find build-android -maxdepth 3 -type d | head -30
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$APK" artifacts/FenSuCloudAlbum-debug.apk
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FenSuCloudAlbum-debug-apk
          path: artifacts/FenSuCloudAlbum-debug.apk
          if-no-files-found: error
